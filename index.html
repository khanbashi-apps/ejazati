<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>إجازتي — تقويم الشفتات</title>
<meta name="description" content="إجازتي — تقويم الشفتات والإجازات">
<meta name="theme-color" content="#F4ECDF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="إجازتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Thmanyah";src:url("thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah";src:url("thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{
  --bg:#F7F3EC;--surface:#FFFFFF;--surface2:#F1EBE1;--text:#1B2A4A;--muted:#5D6577;--line:#E4DCCF;
  --brand:#E9724C;--brand2:#1B2A4A;--onbrand:#FFFFFF;--ring:#1B2A4A;
  --radius:18px;--shadow:0 1px 2px rgba(27,42,74,.06),0 4px 16px rgba(27,42,74,.06);
  --blur:none;--cellbg:#FFFFFF;
}
body[data-theme="dark"]{
  --bg:#0B0F17;--surface:#151B27;--surface2:#1D2534;--text:#EEF1F6;--muted:#A3ABBC;--line:#2A3346;
  --brand:#F08A66;--brand2:#9FB4E8;--onbrand:#111;--ring:#F4ECDF;--shadow:none;--cellbg:#121826;
}
body[data-theme="glass"]{
  --bg:linear-gradient(150deg,#FBD3B8 0%,#F4ECDF 35%,#B9C7EA 70%,#1B2A4A 120%);
  --surface:rgba(255,255,255,.42);--surface2:rgba(255,255,255,.35);--text:#14213D;--muted:#3E4A63;--line:rgba(255,255,255,.6);
  --shadow:0 8px 32px rgba(27,42,74,.14);--blur:blur(18px) saturate(1.4);--cellbg:rgba(255,255,255,.5);
}
body[data-theme="neu"]{
  --bg:#E8E3DA;--surface:#E8E3DA;--surface2:#E8E3DA;--text:#1B2A4A;--muted:#566079;--line:transparent;
  --shadow:6px 6px 14px #C8C2B8,-6px -6px 14px #FFFFFF;--cellbg:#E8E3DA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,label,input,select,textarea,.cell{touch-action:manipulation}
body{font-family:"Thmanyah",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);background-attachment:fixed;color:var(--text);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(var(--tabsH, 72px) + env(safe-area-inset-bottom) + 28px);overflow-x:hidden}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.topbar img{width:36px;height:36px;border-radius:10px}
.topbar h1{font-size:22px;margin:0;font-weight:700;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
body[data-theme="neu"] .btn{box-shadow:var(--shadow);border:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.ghost{background:transparent}
.btn.icon{width:44px;padding:0}
.btn.danger{color:#C0392B}
.btn svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;background:var(--surface2);font-size:13px;border:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
label.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);flex:1;min-width:0}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}
.pair3{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
.pair3>span{padding-bottom:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>.btn{width:100%;min-height:52px;padding:10px 8px;text-align:center}
.actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px}
.actions>.btn{width:100%;min-height:50px}
.actions>.span2{grid-column:1 / -1}
.btn.full{width:100%;min-height:50px}
.btn.danger{color:#C0392B;border-color:rgba(192,57,43,.35)}
.segbar{display:flex;gap:2px;height:12px;border-radius:8px;overflow:hidden;margin-top:10px}
.segbar i{display:block;min-width:3px}
.pcard{align-items:flex-start}
.pact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.notice{display:flex;gap:12px;align-items:flex-start;border-radius:var(--radius);padding:14px;margin-bottom:12px;color:#fff}
.notice .ic{font-size:26px;line-height:1}
.notice h3{margin:0 0 2px;color:inherit;font-size:16px}
.notice p{margin:0;font-size:14px;line-height:1.5}
.notice .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.notice .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff;min-height:40px;padding:6px 12px;text-decoration:none;font-size:14px}
.notice .x{margin-inline-start:auto;background:none;border:none;color:#fff;opacity:.85;width:36px;height:36px;font-size:20px;cursor:pointer;flex:none}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:start;line-height:1.4}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:start}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{box-sizing:border-box;min-width:0;background:var(--cellbg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;color:var(--text)}
input[type=color]{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;padding:2px;background:var(--cellbg)}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:#B8B2A7;border-radius:30px;transition:.2s}
.switch span:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--brand)}
.switch input:checked+span:after{inset-inline-start:25px}
.switch input:focus-visible+span{outline:2px solid var(--ring);outline-offset:2px}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:15px;margin:12px 0 6px;color:var(--muted)}
/* countdown */
.count{display:flex;align-items:center;gap:12px}
.count .big{font-size:40px;font-weight:700;line-height:1;color:var(--brand);min-width:56px;text-align:center}
.count .txt{font-weight:700}
/* calendar */
.calhead{display:flex;align-items:center;gap:6px}
.calhead .title{flex:1;text-align:center}
.calhead .title b{display:block;font-size:20px}
.calhead .title span{font-size:13px;color:var(--muted)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:10px 0 4px;text-align:center;font-size:12px;color:var(--muted)}
.wk .we{color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cell{position:relative;aspect-ratio:1/1.12;border-radius:12px;background:var(--cellbg);border:1px solid var(--line);padding:3px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;overflow:hidden;min-height:52px}
body[data-theme="neu"] .cell{border:none;box-shadow:3px 3px 7px #CBC5BB,-3px -3px 7px #fff}
.cell.empty{background:transparent;border:none;box-shadow:none;cursor:default}
.cell .n{font-weight:700;font-size:16px;line-height:1.2;position:relative;z-index:1}
.cell .h{font-size:10px;color:var(--muted);line-height:1.1;position:relative;z-index:1}
.cell .tag{font-size:10px;font-weight:700;margin-top:auto;position:relative;z-index:1;white-space:nowrap}
.cell .fill{position:absolute;inset:0;opacity:.22}
.cell .fillb{position:absolute;inset:0;opacity:.22}
.cell .bar{position:absolute;left:0;right:0;bottom:0;height:5px}
.cell .barb{position:absolute;bottom:0;height:5px;width:50%;inset-inline-end:0}
.cell.split .bar{width:50%;inset-inline-start:0;right:auto;left:auto}
.cell.today{outline:2.5px solid var(--ring);outline-offset:-2px}
.cell.we .n{color:var(--brand)}
.cell .hol{position:absolute;top:3px;inset-inline-start:4px;width:7px;height:7px;border-radius:50%;z-index:2}
.cell .note{position:absolute;top:3px;inset-inline-end:4px;width:7px;height:7px;border-radius:50%;z-index:2}
.cell.common{box-shadow:inset 0 0 0 3px var(--common)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:8px 10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.alerts{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:14px}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;padding:6px 8px 6px;padding-bottom:calc(env(safe-area-inset-bottom) + 6px);background:var(--surface);border-top:1px solid var(--line);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
body[data-theme="glass"] .tabs{background:rgba(255,255,255,.55)}
.tabs .in{display:flex;max-width:760px;width:100%}
.tabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;font-size:12px;color:var(--muted);cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--brand);font-weight:700}
.fab{position:fixed;bottom:calc(var(--tabsH, 72px) + 12px);inset-inline-start:16px;z-index:19;border-radius:999px;background:var(--brand2);color:var(--bg);border:none;padding:10px 16px;min-height:44px;box-shadow:0 6px 18px rgba(0,0,0,.2);font-weight:700;cursor:pointer;display:none}
body[data-theme="dark"] .fab{color:#0B0F17}
.fab.show{display:inline-flex;align-items:center;gap:6px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);color:var(--text);width:100%;max-width:760px;max-height:88vh;max-height:88dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
body[data-theme="glass"] .sheet{background:rgba(255,255,255,.85)}
body[data-theme="neu"] .sheet{background:#E8E3DA}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface2)}
.item .grow{min-width:0}
.item .t{font-weight:700}
.seq{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.seq .tok{min-width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;padding:0 6px}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);z-index:60;background:var(--brand2);color:var(--bg);padding:12px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;display:none;font-weight:700}
body[data-theme="dark"] .toast{color:#0B0F17}
.toast.show{display:block}
.qr{display:flex;justify-content:center;margin:10px 0}
.qr canvas{background:#fff;border-radius:12px;padding:10px;max-width:240px;width:100%;height:auto}
.credit{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.credit b{color:var(--text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:14px;flex-wrap:wrap}
.seg button{flex:1;border:none;background:transparent;border-radius:10px;min-height:40px;cursor:pointer;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days7 button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--cellbg);cursor:pointer;font-size:13px}
.days7 button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.bal div{background:var(--surface2);border-radius:14px;padding:10px 4px}
.bal b{display:block;font-size:26px}
.progress{height:10px;background:var(--surface2);border-radius:10px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--brand)}
@media (max-width:380px){.cell .h{display:none}.cell .tag{font-size:9px}}
</style>
</head>
<body data-theme="default">
<div class="app" id="app"></div>
<button class="fab" id="fab" type="button"></button>
<nav class="tabs" id="tabs" aria-label="التنقل"><div class="in"></div></nav>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
