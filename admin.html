<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>إجازتي — لوحة الإدارة</title>
<meta name="theme-color" content="#0F1729">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Thmanyah";src:url("thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah";src:url("thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--bg:#F4EFE6;--surface:#fff;--surface2:#F1EBE1;--text:#1B2A4A;--muted:#5D6577;--line:#E4DCCF;--brand:#E9724C;--navy:#0F1729}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{font-family:"Thmanyah",system-ui,-apple-system,Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px)}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header img{width:40px;height:40px;border-radius:11px}
header h1{font-size:20px;margin:0;flex:1}
header .tag{background:var(--navy);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 6px}
h3{font-size:15px;margin:14px 0 6px;color:var(--muted)}
p.hint{margin:0 0 10px;color:var(--muted);font-size:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);min-width:0}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%;min-width:0;color:var(--text)}
input[type=date],input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;text-align:start}
textarea{min-height:90px;resize:vertical}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 14px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.btn.danger{color:#C0392B;border-color:rgba(192,57,43,.35);background:#fff}
.btn.sm{min-height:38px;padding:6px 10px;font-size:14px}
.btn.full{width:100%}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--surface2);padding:5px;border-radius:14px;margin-bottom:12px;position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:5}
.tabs button{border:none;background:transparent;border-radius:10px;min-height:44px;cursor:pointer;font-size:14px}
.tabs button[aria-selected="true"]{background:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item{background:var(--surface2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.item .top{display:flex;align-items:center;gap:8px}
.item .top b{flex:1}
.badge{font-size:12px;border-radius:999px;padding:2px 8px;background:#fff;border:1px solid var(--line)}
.badge.on{background:#E3F4EA;border-color:#B9E2C8;color:#1E7A45}
.list{display:flex;flex-direction:column;gap:10px}
.notice{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px;color:#fff}
.notice .ic{font-size:26px;line-height:1}
.notice h4{margin:0 0 2px;font-size:16px}
.notice p{margin:0;font-size:14px;white-space:pre-line}
.notice .lnk{display:inline-block;margin-top:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:5px 10px;font-size:14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:44px;height:44px;border-radius:12px;border:3px solid transparent;cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--text)}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
.emojis button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.banner{background:#FFF4E5;border:1px solid #F3D3A8;border-radius:14px;padding:12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.steps{margin:0;padding-inline-start:20px;line-height:1.9}
.login{max-width:360px;margin:12vh auto 0;text-align:center}
.login img{width:84px;height:84px;border-radius:22px}
.pin{font-size:28px;letter-spacing:10px;text-align:center;direction:ltr}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;z-index:60;display:none;font-weight:700;max-width:92vw}
.toast.show{display:block}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="admin.js"></script>
</body>
</html>
